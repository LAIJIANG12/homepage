<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links</title>
    <style>
        body {
            background-color: #181818;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            line-height: 1.6;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        li::before {
            content: "■"; /* 绿色方块 */
            color: #7cb342; /* 接近图中的绿色 */
            margin-right: 10px;
            font-size: 0.9em;
        }
        .name {
            width: 220px; /* 固定宽度对齐 */
            font-weight: 500;
        }
        a {
            color: #e0e0e0; /* 或者 #7cb342，这里保持白色 */
            text-decoration: underline;
            text-decoration-color: #7cb342; /* 绿色下划线 */
            text-underline-offset: 4px;
            transition: color 0.2s;
        }
        a:hover {
            color: #7cb342;
        }
        .desc {
            color: #888;
            margin-left: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <ul>
        <li><span class="name">personal GitHub</span> — <a href="https://github.com/rexim" target="_blank">github.com/rexim</a></li>
        <!-- 等等... -->
    </ul>
</body>
</html>
